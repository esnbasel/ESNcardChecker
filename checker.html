<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESNcard Status Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --primary-color: #00AEEF; --green-color: #4CAF50; --red-color: #F44336;
            --light-gray: #f4f4f4; --dark-gray: #333;
        }
        body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; background-color: var(--light-gray); color: var(--dark-gray); }
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 1rem; }
        .container { width: 90%; max-width: 400px; padding: 2rem; background-color: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); text-align: center; }
        h1 { color: var(--primary-color); margin-top: 0; margin-bottom: 1.5rem; font-size: 1.8rem; }
        #esnCodeInput { width: 100%; padding: 12px; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
        .button-group { display: flex; gap: 0.5rem; }
        .button-group button { width: 100%; padding: 14px; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #checkButton { background-color: var(--primary-color); }
        #scanButton { background-color: #555; }
        #statusResult { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; font-weight: bold; font-size: 1.2rem; display: none; }
        #statusResult.active { background-color: #e8f5e9; color: var(--green-color); border: 1px solid var(--green-color); display: block; }
        #statusResult.inactive { background-color: #ffebee; color: var(--red-color); border: 1px solid var(--red-color); display: block; }
        #statusResult span { display: block; font-size: 0.9rem; margin-top: 0.5rem; font-weight: normal; color: #444; text-align: left; }
        #scannerContainer { width: 100%; text-align: center; display: none; }
        #reader { border: 2px solid #eee; border-radius: 8px; overflow: hidden; }
        #stopScanButton { margin-top: 1rem; width: 100%; padding: 12px; background-color: var(--red-color); color: white; border: none; border-radius: 8px; cursor: pointer; }
        footer { width: 100%; text-align: center; padding: 1rem; color: #777; font-size: 0.85rem; }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div id="formContainer">
                <h1>ESNcard Checker</h1>
                <input type="text" id="esnCodeInput" placeholder="Enter card number (e.g. 2068...)">
                <div class="button-group">
                    <button id="checkButton">Check Status</button>
                    <button id="scanButton">📷 Scan</button>
                </div>
                <div id="statusResult"></div>
            </div>
            
            <div id="scannerContainer">
                <div id="reader"></div>
                <button id="stopScanButton">Cancel</button>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2026 Flavien Martinot, ESN Switzerland</p>
    </footer>

    <script>
        const esnInput = document.getElementById('esnCodeInput');
        const statusDiv = document.getElementById('statusResult');

        const checkCardStatus = async () => {
            const code = esnInput.value.trim();
            if (!code) return alert("Please enter a card number.");

            statusDiv.className = '';
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = 'Connecting... ⏳';

            const targetUrl = `https://esncard.org/services/1.0/card.json?code=${code}`;
            
            // Using Codetabs as primary proxy for better reliability
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                // Debugging: If you get an error, check the browser console (F12)
                console.log("Card Data Received:", data);

                const card = Array.isArray(data) ? data[0] : data;

                if (card && card.status === 'active') {
                    statusDiv.className = 'active';
                    statusDiv.innerHTML = `Activated ✅
                        <hr style="border:0; border-top:1px solid #c8e6c9; margin: 10px 0;">
                        <span><strong>Card:</strong> ${card.code}</span>
                        <span><strong>Section:</strong> ${card['section-code']}</span>
                        <span><strong>Issued:</strong> ${card['activation date'] || 'N/A'}</span>
                        <span><strong>Expires:</strong> ${card['expiration-date']}</span>`;
                } else if (card && card.status) {
                    statusDiv.className = 'inactive';
                    statusDiv.textContent = `Status: ${card.status.toUpperCase()} ❌`;
                } else {
                    statusDiv.className = 'inactive';
                    statusDiv.textContent = 'Card Not Found ❌';
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                statusDiv.className = 'inactive';
                statusDiv.innerHTML = `Connection Error ❌<br><span style="font-size:0.7rem; color: #888;">Try again or use a different network.</span>`;
            }
        };

        // --- Scanner Functions ---
        let html5QrCode;
        function showScanner() {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('scannerContainer').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                esnInput.value = text.startsWith(']C1') ? text.substring(3) : text;
                hideScanner();
                checkCardStatus();
            }).catch(() => {
                alert("Camera access failed.");
                hideScanner();
            });
        }
        
        function hideScanner() {
            if (html5QrCode?.isScanning) html5QrCode.stop();
            document.getElementById('scannerContainer').style.display = 'none';
            document.getElementById('formContainer').style.display = 'block';
        }
        
        document.getElementById('checkButton').addEventListener('click', checkCardStatus);
        document.getElementById('scanButton').addEventListener('click', showScanner);
        document.getElementById('stopScanButton').addEventListener('click', hideScanner);
        esnInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') checkCardStatus(); });
    </script>
</body>
</html>
